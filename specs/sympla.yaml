          - REFUNDED
          - NOT_APPROVED
          - UNPAID
          description: '<br> Um pedido pode ter diferentes status durante o ciclo de vida do evento: <br> **PENDING:** Significa que o pedido está pendente de aprovação (cartão de crédito) ou pendente de pagamento (boleto e débito bancário)  <br> **APPROVED:** Significa que o pedido está aprovado e não varia de acordo com o método de pagamento. <br> **NOT_APPROVED:** Significa que o pedido não foi aprovado e, portanto, não foi pago. Esse status é exibido apenas para pedidos adquiridos por cartão de crédito; <br> **UNPAID:** Significa que o pagamento não foi concluído e, portanto, não foi pago. Esse status é exibido apenas para pedidos adquiridos por boleto bancário ou débito online; <br> **REFUNDED:** Significa que foi solicitado o reembolso de um pedido. <br> **CANCELLED:** Significa que o pedido foi reembolsado. <br>

