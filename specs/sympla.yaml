openapi: 3.1.0
servers:
- url: https://api.sympla.com.br/public/v1.5.1
  description: Servidor de produção
info:
  description: '# Introdução

    Bem-vindo à API pública da Sympla! <br><br> A API da Sympla é a interface pública de acesso a dados da plataforma Sympla. Através dela é possível obter informações relacionadas aos eventos criados por você, como ingressos, pedidos e participantes. <br><br> A API disponibiliza endpoints com respostas em formato JSON, implementados conforme os princípios da arquitetura REST, garantindo integração segura, eficiente e de fácil consumo. O acesso aos dados é restrito aos eventos do próprio cliente, sendo necessária autenticação prévia para utilização dos recursos. Em conformidade com as boas práticas de design de APIs, campos cujo valor seja null são omitidos das respostas por padrão, de forma a otimizar a transferência de dados e evitar informações irrelevantes. Contudo, todos os endpoints oferecem suporte ao parâmetro FIELDS, que pode ser informado via querystring para especificação explícita dos atributos a serem incluídos na resposta. Quando esse parâmetro é utilizado, os campos com valor
    null também serão retornados, garantindo maior controle sobre a estrutura da resposta.<br><br> Neste documento você encontrará a referência técnica de como acessar todos os serviços disponíveis da API. <br>


    # Autenticação

    Para executar requisições válidas à Sympla API é necessário uma chave de acesso (token) associada ao seu usuário na plataforma. Este token deverá assinar todas as requisições enviadas à API. <br><br> Para gerar a chave de acesso é preciso logar na plataforma Sympla, acessar o menu "<a href="https://organizador.sympla.com.br/minha-conta" target="_blank">Minha Conta</a>" (a partir do nome do seu usuário) e navegar até a aba "Integrações". <br><br> ![Autenticação](/api-doc/images/autenticacao.png) <br><br> Nesta página, basta informar um nome identificando o token e clicar em "Criar chave de acesso". Você poderá gerar mais de uma credencial de acesso conforme a sua necessidade.<br><br>

    <!-- ReDoc-Inject: <security-definitions> -->

    '
  version: v1.5.1
  title: Sympla API
  termsOfService: https://termos-e-politicas.sympla.com.br/hc/pt-br/sections/360005978591-Termos-de-Uso-API
  contact:
    name: Suporte a API
  x-logo:
    url: /api-doc/images/logo-api.png
tags:
- name: Eventos
  description: Esta API fornece acesso às informações de eventos criados na plataforma Sympla, exclusivamente aqueles vinculados ao usuário proprietário do token. <br><br> A API também permite a personalização dos resultados, possibilitando filtrar eventos dentro de uma janela de data ou restringir quais campos são relevantes e devem ser exibidos no retorno, como apenas nome do evento e descrição.
- name: Pedidos
  description: A API de pedidos proporciona informações de compras (ou inscrições, caso o evento seja gratuito) como dados de ingressos, participantes e pagamento. Um pedido pode conter mais de um ingresso e um ingresso está sempre associado a um único participante. <br><br> É possível consultar os dados para emissão da nota fiscal, caso o evento esteja configurado para solicitar estas informações durante o processo de compra (<a href="https://ajuda.sympla.com.br/hc/pt-br/articles/360000508286-Como-posso-coletar-os-dados-dos-participantes-para-emiss%C3%A3o-de-Nota-Fiscal-" target="_blank">saiba mais</a>).
- name: Participantes
  description: Com a API de participantes é possível obter informações relativas aos titulares dos ingressos do evento, como nome, e-mail e realizar check-in de um participante. <br><br> A API também retornará informações obtidas via campos customizados, caso tenham sido adicionados no formulário de inscrição do evento.
- name: Check-in
  description: 'Com a API de checkin é possível realizar a validação do ingresso dos usuários de três maneiras.


    * Com o ID do ingresso também conhecido como ID do participante

    * Numero do ticket, podendo ser ticketNumber quando estamos falando de DIY ou scanneableCode quando estamos falando dos eventos Bileto.

    * E por fim, pelo QrCode gerado pelo App do cliente de forma dinâmica. Este terceiro modo usa um processo de

    assinatura dos ingressos, que serve como uma camada a mais de segurança.

    '
paths:
