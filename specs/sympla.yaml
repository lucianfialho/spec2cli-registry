        $ref: '#/components/parameters/Pagination_PageSize'
      - x-oad-type: reference
        $ref: '#/components/parameters/Pagination_Page'
      - name: field_sort
        in: query
        description: Permite que os resultados sejam ordenados (apenas os campos id, start_date, end_date e name)
        required: false
        schema:
          type: string
          default: start_date
        x-oad-type: parameter
      - x-oad-type: reference
        $ref: '#/components/parameters/Sort_Sort'
      - x-oad-type: reference
        $ref: '#/components/parameters/Filter_Fields'
