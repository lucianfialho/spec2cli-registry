            application/json:
              schema:
                $ref: '#/components/schemas/Response200Events'
          x-oad-type: reference
        '400':
          description: Erro de dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
          x-oad-type: reference
        '401':
          description: Erro de autorização
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError401'
          x-oad-type: reference
      parameters:
      - name: from
        in: query
        description: Data no formato YYYY-MM-DD HH:mm:ss. Para filtrar todos os eventos que começam a partir da data informada
        required: false
        schema:
          type: string
        x-oad-type: parameter
      - name: published
        in: query
        description: Por padrão somente os eventos publicados serão listados.
        required: false
        schema:
          type: boolean
          default: true
        x-oad-type: parameter
