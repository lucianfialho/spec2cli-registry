      - Eventos
      operationId: getAllEvent
      summary: Listar eventos
      description: Retorna os eventos criados pelo organizador.
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: 'curl --request GET \

          --url ''https://api.sympla.com.br/public/v1.5.1/events'' \

          --header ''s_token: <TOKEN_USER>''

          '
      responses:
        '200':
          description: Sucesso!
